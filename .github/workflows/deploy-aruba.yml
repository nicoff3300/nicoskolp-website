name: Deploy su Hosting Aruba

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-aruba
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build & FTPS Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Installa dipendenze
        run: npm ci

      - name: 🔍 Controllo tipi e validazione dati
        run: |
          npm run test:data
          npm run check

      - name: 🚀 Compila sito Astro (dist)
        run: npm run build

      - name: 🩺 Audit e validazione build di produzione
        run: npm run audit

      - name: 🌐 Risoluzione host FTP con fallback intelligente
        id: ftp-host
        env:
          FTP_SERVER_SECRET: ${{ secrets.FTP_SERVER }}
        run: |
          python3 -c '
          import socket, sys, os
          host = os.environ.get("FTP_SERVER_SECRET", "").strip() or "ftp.nicoskolp.com"
          resolved = host
          try:
              socket.getaddrinfo(host, 21)
              sys.stderr.write(f"✅ Host FTP \"{host}\" risolto con successo via DNS.\n")
          except Exception as e:
              resolved = "89.46.104.218"
              sys.stderr.write(f"⚠️ Impossibile risolvere \"{host}\" via DNS ({e}). Utilizzo fallback IP cluster Aruba: {resolved}\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"host={resolved}\n")
          '

      - name: 🧹 Rimuovi file default Aruba (file di cortesia)
        env:
          FTP_SERVER: ${{ steps.ftp-host.outputs.host }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          TARGET_DIR: ${{ secrets.FTP_SERVER_DIR || 'www.nicoskolp.com/' }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "⚠️ Credenziali FTP non configurate nei secrets. Salto la rimozione dei file di cortesia."
            exit 0
          fi
          CLEAN_DIR="${TARGET_DIR#/}"
          [[ "$CLEAN_DIR" != */ && -n "$CLEAN_DIR" ]] && CLEAN_DIR="${CLEAN_DIR}/"
          FTP_URL="ftp://${FTP_SERVER%/}/${CLEAN_DIR}"
          echo "Verifica e rimozione file di benvenuto Aruba (index.php, default.html) su ${FTP_URL}..."
          for file in index.php default.html; do
            curl -s --connect-timeout 10 --max-time 30 --ssl-reqd --insecure -u "${FTP_USERNAME}:${FTP_PASSWORD}" "${FTP_URL}" -Q "DELE ${file}" -o /dev/null || \
            curl -s --connect-timeout 10 --max-time 30 --insecure -u "${FTP_USERNAME}:${FTP_PASSWORD}" "${FTP_URL}" -Q "DELE ${file}" -o /dev/null || true
          done

      - name: 📤 Deploy FTPS su Aruba (connessione protetta TLS)
        id: deploy-ftps
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        continue-on-error: true
        with:
          server: ${{ steps.ftp-host.outputs.host }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'www.nicoskolp.com/' }}
          local-dir: ./dist/
          protocol: ftps
          port: 21
          security: loose
          dangerous-clean-slate: false

      - name: 📤 Fallback Deploy FTP standard (se FTPS non disponibile)
        if: steps.deploy-ftps.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp-host.outputs.host }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'www.nicoskolp.com/' }}
          local-dir: ./dist/
          protocol: ftp
          port: 21
          dangerous-clean-slate: false

