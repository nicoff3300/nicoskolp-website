name: Deploy su Hosting Aruba

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-aruba
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & FTPS Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Installa dipendenze
        run: npm ci

      - name: 🔍 Controllo tipi e validazione dati
        run: |
          npm run test:data
          npm run check

      - name: 🚀 Compila sito Astro (dist)
        run: npm run build

      - name: 🔍 Esplora directory FTP Aruba
        run: |
          curl --ssl-reqd --insecure -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/" || true

      - name: 📤 Deploy FTPS su Aruba
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          local-dir: ./dist/
          protocol: ftps
          dangerous-clean-slate: false
